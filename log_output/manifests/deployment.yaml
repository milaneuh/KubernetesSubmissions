apiVersion: apps/v1
kind: Deployment
metadata:
  name: hashgenerator-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hashgenerator
  template:
    metadata:
      labels:
        app: hashgenerator
    spec:
      volumes:
        - name: shared-image
          emptyDir: {}
      containers:
        - name: hashgenerator-writer
          image: m17an/hashgen:v3
          env:
          - name: LOG_FILE
            value: "/usr/src/app/file/log_output.txt"
          volumeMounts:
          - name: shared-image
            mountPath: /usr/src/app/files

        - name: hashgenerator-reader
          image: m17an/hashgen:v3
          env:
          - name: PORT
            value: "3010"
          - name: LOG_FILE
            value: "/usr/src/app/file/log_output.txt"
          volumeMounts:
          - name: shared-image
            mountPath: /usr/src/app/files
