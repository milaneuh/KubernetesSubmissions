apiVersion: apps/v1
kind: Deployment
metadata:
  name: hashgenerator-dep
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hashgenerator
  template:
    metadata:
      labels:
        app: hashgenerator
    spec:
      volumes:
        - name: shared-image
          persistentVolumeClaim:
            claimName: image-claim
      containers:
        - name: hashgenerator-writer
          image: m17an/hashgen:v8
          volumeMounts:
            - name: shared-image
              mountPath: /usr/src/app/files
        - name: hashgenerator-reader
          image: m17an/hashgen:v8
          env:
            - name: PORT
              value: "3010"
          volumeMounts:
            - name: shared-image
              mountPath: /usr/src/app/files
