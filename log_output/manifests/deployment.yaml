apiVersion: apps/v1
kind: Deployment
metadata:
  name: hashgenerator-dep
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hashgenerator
  template:
    metadata:
      labels:
        app: hashgenerator
    spec:
      volumes:
        - name: shared-image
          persistentVolumeClaim:
            claimName: image-claim
        - name: config
          configMap:
            name: hashgenerator-cm
            items:
            - key: "file-content"
              path: "file-content"
      containers:
        - name: hashgenerator-writer
          image: m17an/hashgen:v9
          volumeMounts:
            - name: shared-image
              mountPath: /usr/src/app/files
        - name: hashgenerator-reader
          image: m17an/hashgen:v9
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: hashgenerator-cm
                  key: port
            - name: MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: hashgenerator-cm
                  key: message
          volumeMounts:
            - name: shared-image
              mountPath: /usr/src/app/files
            - name: config
              mountPath: /config
              readOnly: true
