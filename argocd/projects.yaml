apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: exercises
spec:
  sourceRepos:
    - https://github.com/milaneuh/KubernetesSubmissions.git
  destinations:
    - server: 'https://kubernetes.default.svc'
      namespace: exercises
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
