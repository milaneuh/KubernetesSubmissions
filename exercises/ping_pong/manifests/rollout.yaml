apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: pingpong-rol
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pingpong
  strategy:
    canary:
      steps:
        - setWeight: 25
        - pause: {duration: 1m}
        - analysis:
            templates:
                - templateName: exercises-cpu-at
  template:
    metadata:
      labels:
        app: pingpong
    spec:
      containers:
        - name: pingpong
          image: m17an/pingpong:v9
          env:
            - name: PORT
              value: "3020"
            - name: POSTGRES_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: pingp-psql-cm
                  key: postgres-password
            - name: DATABASE_URL
              value: "postgres://postgres:$(POSTGRES_PASSWORD)@pingp-psql-svc:5432/postgres?sslmode=disable"
          ports:
            - name: http
              containerPort: 3020
          readinessProbe:
            initialDelaySeconds: 10
            periodSeconds: 5
            httpGet:
               path: /health
               port: http
