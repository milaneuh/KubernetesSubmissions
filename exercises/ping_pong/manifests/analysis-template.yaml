apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: exercises-cpu-at
spec:
  metrics:
  - name: cpu-rate
    interval: 1m
    count: 5
    failureLimit: 0
    successCondition: result[0] < 0.2
    provider:
      prometheus:
        address: http://prom-prometheus-server.monitoring.svc.cluster.local:80
        query: |
          sum(rate(container_cpu_usage_seconds_total{namespace="exercises", container!="", image!=""}[5m]))
