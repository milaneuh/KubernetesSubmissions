name: Release exercises

on:
  push:
    branches:
      - main
    paths:
      - 'exercises/**'
      - '.github/workflows/exercises.yaml'

permissions:
  contents: write
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  REGISTRY: europe-north1-docker.pkg.dev
  REPOSITORY: my-repository
  BRANCH: ${{ github.ref_name }}

jobs:
  build-publish-deploy:
    name: Build, Publish and Update manifests
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.SERVICE_ACCOUNT }}"

      - name: 'Set up Cloud SDK'
        uses: google-github-actions/setup-gcloud@v3

      - run: gcloud --quiet auth configure-docker $REGISTRY

      - name: 'Form the image names'
        run: |-
          echo "HASHGEN_IMAGE=$REGISTRY/$PROJECT_ID/$REPOSITORY/hashgen:$BRANCH-$GITHUB_SHA" >> $GITHUB_ENV
          echo "PINGPONG_IMAGE=$REGISTRY/$PROJECT_ID/$REPOSITORY/pingpong:$BRANCH-$GITHUB_SHA" >> $GITHUB_ENV

      - name: Build
        run: |-
          docker build --tag $HASHGEN_IMAGE exercises/log_output
          docker build --tag $PINGPONG_IMAGE exercises/ping_pong

      - name: Publish
        run: |-
          docker push $HASHGEN_IMAGE
          docker push $PINGPONG_IMAGE

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Update image tags
        working-directory: exercises
        run: kustomize edit set image m17an/hashgen=$HASHGEN_IMAGE m17an/pingpong=$PINGPONG_IMAGE

      - name: Commit
        run: |-
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exercises/kustomization.yaml
          git commit -m "Update exercises images to $GITHUB_SHA"
          git push
