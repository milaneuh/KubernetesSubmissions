name: Release argo cd

on:
  push:
    branches:
      - main
    paths:
      - 'argocd/**'
      - '.github/workflows/argocd.yaml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  GKE_CLUSTER: dwk-cluster
  GKE_ZONE: europe-north1-b
  NAMESPACE: argocd

jobs:
  deploy:
    name: Deploy Argo CD
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.SERVICE_ACCOUNT }}"

      - name: 'Set up Cloud SDK'
        uses: google-github-actions/setup-gcloud@v3

      - name: 'Get GKE credentials'
        uses: 'google-github-actions/get-gke-credentials@v3'
        with:
          cluster_name: '${{ env.GKE_CLUSTER }}'
          project_id: '${{ env.PROJECT_ID }}'
          location: '${{ env.GKE_ZONE }}'

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Deploy
        working-directory: argocd
        run: |-
          kustomize build . > argocd.yaml
          yq 'select(.kind == "CustomResourceDefinition")' argocd.yaml | kubectl apply --server-side -f -
          until kubectl wait --for=condition=Established crd/applications.argoproj.io crd/appprojects.argoproj.io --timeout=60s; do sleep 2; done
          kubectl apply --server-side -f argocd.yaml
          kubectl rollout status deployment argocd-server -n $NAMESPACE
