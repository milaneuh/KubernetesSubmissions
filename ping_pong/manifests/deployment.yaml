apiVersion: apps/v1
kind: Deployment
metadata:
  name: pingpong-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pingpong
  template:
    metadata:
      labels:
        app: pingpong
    spec:
      volumes:
        - name: shared-image
          persistentVolumeClaim:
            claimName: image-claim
      containers:
        - name: pingpong
          image: m17an/pingpong:v3
          env:
            - name: PORT
              value: "3020"
            - name: PONG_FILE
              value: /usr/src/app/files/pingpong_output.txt
          volumeMounts:
            - name: shared-image
              mountPath: /usr/src/app/files
