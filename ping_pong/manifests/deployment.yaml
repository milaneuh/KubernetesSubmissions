apiVersion: apps/v1
kind: Deployment
metadata:
  name: pingpong-dep
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pingpong
  template:
    metadata:
      labels:
        app: pingpong
    spec:
      containers:
        - name: pingpong
          image: m17an/pingpong:v9
          env:
            - name: PORT
              value: "3020"
            - name: POSTGRES_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: pingp-psql-cm
                  key: postgres-password
            - name: DATABASE_URL
              value: "postgres://postgres:$(POSTGRES_PASSWORD)@pingp-psql-svc:5432/postgres?sslmode=disable"
