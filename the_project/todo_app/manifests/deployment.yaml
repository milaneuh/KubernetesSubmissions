apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
        - name: image-storage
          persistentVolumeClaim:
            claimName: todo-image-claim
      containers:
        - name: todo-app
          image: m17an/todo_app:v14
          env:
          - name: PORT
            value: "3000"
          - name: IMAGE_PATH
            value: "/usr/src/app/files/image.jpg"
          volumeMounts:
            - name: image-storage
              mountPath: /usr/src/app/files
