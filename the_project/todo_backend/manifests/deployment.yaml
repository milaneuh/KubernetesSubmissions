apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-backend
  namespace: NAMESPACE
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: todo-backend
  template:
    metadata:
      labels:
        app: todo-backend
    spec:
      containers:
        - name: todo-backend
          image: TODO_APP/BACKEND
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: todo-backend-cm
                  key: port
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: todo-db-cm
                  key: postgres-user
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: todo-db-cm
                  key: postgres-db
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: todo-db-cm
                  key: postgres-host
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: todo-db-cm
                  key: postgres-port
            - name: DB_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: todo-db-cm
                  key: postgres-password
            - name: DATABASE_URL
              value: "postgres://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)?sslmode=disable"
