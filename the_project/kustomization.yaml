apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./manifests/namespace.yaml
  - ./manifests/todo-app-persistentvolumeclaim.yaml
  - ./todo_backend/manifests/config-map.yaml
  - ./todo_backend/manifests/postgres.yaml
  - ./todo_backend/manifests/service.yaml
  - ./todo_backend/manifests/deployment.yaml
  - ./todo_backend/manifests/batch.yaml
  - ./todo_app/manifests/config-map.yaml
  - ./todo_app/manifests/service.yaml
  - ./todo_app/manifests/deployment.yaml
  - ./manifests/ingress.yaml
images:
  - name: TODO_APP/BACKEND
    newName: m17an/todo_backend:v5
  - name: TODO_APP/BATCH
    newName: curlimages/curl:8.11.0
  - name: TODO_APP/WEB
    newName: m17an/todo_app:v16
  - name: TODO_APP/POSTGRES
    newName: postgres:14.5
