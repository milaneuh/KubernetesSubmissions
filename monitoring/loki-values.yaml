deploymentMode: SingleBinary

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

chunksCache:
  enabled: false
resultsCache:
  enabled: false

lokiCanary:
  enabled: false
test:
  enabled: false

loki:
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  useTestSchema: true

singleBinary:
  replicas: 1
  extraEnv:
    - name: GOMEMLIMIT
      value: 300MiB
  resources:
    requests:
      memory: 192Mi
    limits:
      memory: 384Mi

gateway:
  resources:
    requests:
      memory: 16Mi
    limits:
      memory: 64Mi

sidecar:
  rules:
    enabled: false
