apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - namespace.yaml
helmCharts:
  - name: prometheus
    repo: https://prometheus-community.github.io/helm-charts
    version: 29.48.0
    releaseName: prom
    namespace: monitoring
    valuesFile: prom-values.yaml
  - name: loki
    repo: https://grafana.github.io/helm-charts
    version: 7.7.0
    releaseName: loki
    namespace: monitoring
    valuesFile: loki-values.yaml
  - name: k8s-monitoring
    repo: https://grafana.github.io/helm-charts
    version: 4.6.1
    releaseName: k8smon
    namespace: monitoring
    valuesFile: k8smon-values.yaml
    includeCRDs: true
    skipHooks: true
  - name: grafana
    repo: https://grafana-community.github.io/helm-charts
    version: 14.5.0
    releaseName: grafana
    namespace: monitoring
    valuesFile: grafana-values.yaml
    skipHooks: true
