cluster:
  name: dwk-cluster

destinations:
  localLoki:
    type: loki
    url: http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push
    tenantId: "1"

podLogsViaLoki:
  enabled: true
  collector: alloy-singleton

collectors:
  alloy-singleton:
    presets: [filesystem-log-reader]
    alloy:
      resources:
        requests:
          memory: 80Mi
        limits:
          memory: 192Mi

selfReporting:
  enabled: false

alloy-operator:
  resources:
    requests:
      memory: 48Mi
    limits:
      memory: 96Mi
