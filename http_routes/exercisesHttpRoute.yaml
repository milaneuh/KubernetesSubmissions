apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: exercises-route
  namespace: exercises
spec:
  parentRefs:
  - name: exercises-gateway
    namespace: default
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /log
    backendRefs:
    - name: hashgenerator-svc
      port: 2345
  - matches:
    - path:
        type: PathPrefix
        value: /pingpong
    backendRefs:
    - name: pingpong-svc
      port: 2345
  - matches:
    - path:
        type: Exact
        value: /
    filters:
      - type: URLRewrite
        urlRewrite:
          path:
            type: ReplaceFullPath
            replaceFullPath: /pingpong
    backendRefs:
    - name: pingpong-svc
      port: 2345
